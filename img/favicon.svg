<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title">
  <title id="title">ITHelps.pro logo — minimal lightbulb with circuit</title>
  <defs>
    <style>
      .stroke { fill: none; stroke: #2e8555; stroke-width: 10; stroke-linecap: round; stroke-linejoin: round; }
      .stroke-thin { fill: none; stroke: #2e8555; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .dot { fill: #2e8555; }
      .inner-dot { fill: #ffffff; }
    </style>
  </defs>

  <!-- Bulb outline -->
  <path class="stroke" d="
    M128 24
    C94 24 66 50 66 86
    C66 118 86 140 86 168
    L86 164
    C86 178 98 190 112 190
    L144 190
    C158 190 170 178 170 164
    L170 168
    C170 140 190 118 190 86
    C190 50 162 24 128 24
    Z" />

  <!-- Bulb base lines -->
  <rect x="105" y="206" width="46" height="10" rx="5" class="stroke-thin" />
  <rect x="116" y="222" width="24" height="10" rx="5" class="stroke-thin" />

  <!-- Circuit stem (central) -->
  <path class="stroke-thin" d="M128 68 L128 186" />

  <!-- Left branch -->
  <path class="stroke-thin" d="M128 132 L104 108" />
  <!-- Right branch -->
  <path class="stroke-thin" d="M128 112 L156 90" />

  <!-- Endpoint dots (filled with blue, small white center to mimic original) -->
  <g>
    <circle class="dot" cx="128" cy="62" r="9" />
    <circle class="inner-dot" cx="128" cy="62" r="3" />
  </g>

  <g>
    <circle class="dot" cx="102" cy="106" r="9" />
    <circle class="inner-dot" cx="102" cy="106" r="3" />
  </g>

  <g>
    <circle class="dot" cx="156" cy="90" r="9" />
    <circle class="inner-dot" cx="156" cy="90" r="3" />
  </g>

  <!-- Small accents: where stem meets branches (rounded ends already from stroke-linecap) -->
</svg>
